name: daily_wisdom_flutter
description: "Daily inspirational quotes app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.9

  # Fonts
  google_fonts: ^6.1.0

  # State & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Ads (uncomment when AdMob ID is ready)
  # google_mobile_ads: ^4.0.0

  # Share
  share_plus: ^7.2.1

  # Localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
