# Flutter 앱(daily_wisdom_flutter)을 빌드해 Google Play에 업로드한다.
#
# 트리거
#   - 태그 push: `git tag app-v1.3.1 && git push origin app-v1.3.1` → internal 트랙
#   - 수동 실행: Actions 탭 > Android Release > Run workflow (트랙 선택)
#
# 필요한 GitHub Secrets
#   ANDROID_KEYSTORE_BASE64     업로드 keystore(.jks)를 base64 인코딩한 값
#   ANDROID_KEYSTORE_PASSWORD   key.properties 의 storePassword
#   ANDROID_KEY_ALIAS           key.properties 의 keyAlias
#   ANDROID_KEY_PASSWORD        key.properties 의 keyPassword
#   PLAY_SERVICE_ACCOUNT_JSON   Play Console 출시 권한이 있는 서비스 계정 JSON 키 원문
#
# versionCode 는 VERSION_CODE_OFFSET + 워크플로 실행 번호로 자동 증가한다.

name: Android Release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console 트랙"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.railit.dailywisdom
  VERSION_CODE_OFFSET: 100

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: daily_wisdom_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/app-v}"
          else
            VERSION_NAME="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')"
          fi
          VERSION_CODE=$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 서명 정보가 없으면 build.gradle.kts 가 debug 키로 서명하므로 여기서 중단한다.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            daily_wisdom_flutter/build/app/outputs/bundle/release/app-release.aab
            daily_wisdom_flutter/build/app/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: daily_wisdom_flutter/build/app/outputs/bundle/release/app-release.aab
          mappingFile: daily_wisdom_flutter/build/app/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Clean up signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
